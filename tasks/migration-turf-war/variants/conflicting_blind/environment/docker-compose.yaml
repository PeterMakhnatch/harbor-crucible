x-seat: &seat
  build:
    context: .
    dockerfile: Dockerfile.seat
  user: player
  working_dir: /home/player
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    # Harbor's build overlay replaces main's command with a sleep. Declaring it
    # here (this file merges after that overlay) keeps the world running.
    command: ["/usr/bin/python3", "-u", "/opt/migration/world.py"]
    init: true
    # The controller verifies /proc/PID/exe for workloads with a different UID.
    cap_add: [SYS_PTRACE]
    security_opt: ["no-new-privileges:true"]
    environment:
      CONDITION: conflicting_blind
      SEED: "42"
      TOKEN_MIGRATOR_C: "03ceb18fcab2d3c04b989255185c89c178799bb17e1c20d7abc0f853aaf1743a"
      TOKEN_MIGRATOR_RUBY: "13924e94d2186af44f3b7d6e74949cb314f6852fcf841defc178475e379b7577"
      TOKEN_MIGRATOR_TS: "a0436e507a96c78e144d3e80ee89edfe9e02ff8c2ca91fa369a47b5b39415adc"
    expose: ["8080", "9000"]
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=1).close()"]
      interval: 1s
      timeout: 2s
      retries: 12
  migrator_c:
    <<: *seat
    environment:
      SEAT: migrator_c
      SEAT_TOKEN: "03ceb18fcab2d3c04b989255185c89c178799bb17e1c20d7abc0f853aaf1743a"
  migrator_ruby:
    <<: *seat
    environment:
      SEAT: migrator_ruby
      SEAT_TOKEN: "13924e94d2186af44f3b7d6e74949cb314f6852fcf841defc178475e379b7577"
  migrator_ts:
    <<: *seat
    environment:
      SEAT: migrator_ts
      SEAT_TOKEN: "a0436e507a96c78e144d3e80ee89edfe9e02ff8c2ca91fa369a47b5b39415adc"
