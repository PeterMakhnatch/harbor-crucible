[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harbor-crucible"
version = "0.1.0"
description = "Adversarial multi-agent evaluation, sabotage/collusion stress-testing, causal trace timelines, and calibrated multi-tier monitor benchmarking for Harbor Multi-Agent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Peter Makhnatch" }]
dependencies = [
    "pydantic>=2.10.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
crucible = "crucible.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
