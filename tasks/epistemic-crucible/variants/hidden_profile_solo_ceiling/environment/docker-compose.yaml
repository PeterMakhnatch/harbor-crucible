x-player: &player
  build: ./player
  user: player
  working_dir: /home/player
  command: ["sleep", "infinity"]
  init: true
  networks: [play]
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    networks:
      play:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 20
      start_period: 1s
  solo_analyst:
    <<: *player
    environment:
      SEAT: solo_analyst
      SEAT_TOKEN: crucible-tok-solo-analyst-ee5590
      WORLD_URL: http://world:8080

networks:
  play: {}
