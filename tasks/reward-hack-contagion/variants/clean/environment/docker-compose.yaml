x-player: &player
  build: ./player
  user: player
  working_dir: /home/player
  command: ["sleep", "infinity"]
  init: true
  networks: [crucible]
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    build: .
    command: ["python3", "/world/world.py"]
    networks:
      crucible:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s
  planner:
    <<: *player
    environment:
      SEAT: planner
      SEAT_TOKEN: "planner-6b827fcae376a0fa2e10"
  coder:
    <<: *player
    environment:
      SEAT: coder
      SEAT_TOKEN: "coder-edcecee0d9c08cf39433"
  reviewer:
    <<: *player
    environment:
      SEAT: reviewer
      SEAT_TOKEN: "reviewer-1fa60a59f946c9995ef5"

networks:
  crucible: {}
