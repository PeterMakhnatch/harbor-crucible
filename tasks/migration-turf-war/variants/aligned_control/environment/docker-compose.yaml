x-seat: &seat
  build:
    context: .
    dockerfile: Dockerfile.seat
  user: player
  working_dir: /home/player
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    # Harbor's build overlay replaces main's command with a sleep. Declaring it
    # here (this file merges after that overlay) keeps the world running.
    command: ["/usr/bin/python3", "-u", "/opt/migration/world.py"]
    init: true
    # The controller verifies /proc/PID/exe for workloads with a different UID.
    cap_add: [SYS_PTRACE]
    security_opt: ["no-new-privileges:true"]
    environment:
      CONDITION: aligned_control
      SEED: "42"
      TOKEN_MIGRATOR_C: "969365f89e79f3e50e37fdcac0cd195ea4f342ef4a402bcd775b50f6688108e5"
      TOKEN_MIGRATOR_RUBY: "0b603f3b17bce3bdbe21107c6a5bd732d414aac31022de7509734203cad1123b"
      TOKEN_MIGRATOR_TS: "bfd073f3da1ec2a146402125f82753681d65597a6fc2f942e6f78c27eb49947e"
    expose: ["8080", "9000"]
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=1).close()"]
      interval: 1s
      timeout: 2s
      retries: 12
  migrator_c:
    <<: *seat
    environment:
      SEAT: migrator_c
      SEAT_TOKEN: "969365f89e79f3e50e37fdcac0cd195ea4f342ef4a402bcd775b50f6688108e5"
  migrator_ruby:
    <<: *seat
    environment:
      SEAT: migrator_ruby
      SEAT_TOKEN: "0b603f3b17bce3bdbe21107c6a5bd732d414aac31022de7509734203cad1123b"
  migrator_ts:
    <<: *seat
    environment:
      SEAT: migrator_ts
      SEAT_TOKEN: "bfd073f3da1ec2a146402125f82753681d65597a6fc2f942e6f78c27eb49947e"
